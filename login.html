<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — opencode</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d26;
      --border: #2a2f3a;
      --text: #e8eaf0;
      --muted: #8b90a0;
      --accent: #6366f1;
      --accent-hover: #7779f5;
      --danger: #ef4444;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.15s;
    }
    .field input:focus { border-color: var(--accent); }

    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }

    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .link {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .link:hover { color: var(--text); }

    .error {
      background: #2a1515;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .error.show { display: block; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .spinner.active { display: inline-block; }
    .btn:disabled .spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your opencode account</p>

    <div class="error" id="error"></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="row">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="field" style="flex:0 0 160px;">
          <label for="remember" style="display:block;margin-bottom:6px;">
            <input id="remember" type="checkbox" />
            Remember me
          </label>
        </div>
      </div>

      <button class="btn" id="btn" type="submit">Sign in</button>
      <span class="spinner" id="spinner"></span>
    </form>

    <div class="actions">
      <p class="link">Forgot password?</p>
      <p class="link">Create an account</p>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const error = document.getElementById("error");
    const btn = document.getElementById("btn");
    const spinner = document.getElementById("spinner");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.classList.remove("show");
      btn.disabled = true;
      spinner.classList.add("active");

      const payload = {
        email: email.value.trim(),
        password: password.value,
        remember: document.getElementById("remember").checked,
      };

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || "Invalid email or password.");
        }

        // Persist the session cookie for "Remember me"
        if (payload.remember) {
          document.cookie =
            "opencode_session=" + data.sessionId +
            "; path=/; max-age=" + 60 * 60 * 24 * 7 +
            "; SameSite=Lax";
        }

        // Replace with actual redirect target in your setup
        window.location.href = "/dashboard";
      } catch (err) {
        error.textContent = err.message;
        error.classList.add("show");
      } finally {
        btn.disabled = false;
        spinner.classList.remove("active");
      }
    });
  </script>
</body>
</html>
